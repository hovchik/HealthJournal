org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttp.nonProxyHosts=localhost|127.0.0.1
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Keep JNI libs compressed in App Bundles so the installer extracts TFLite's
# prebuilt .so files (4 KB aligned) into memory with correct 16 KB page alignment.
android.bundle.enableUncompressedNativeLibs=false
